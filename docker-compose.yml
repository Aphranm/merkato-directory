services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merkato
      POSTGRES_USER: merkato
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merkato -d merkato"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://merkato:change-me@db:5432/merkato
      SECRET_KEY: change-this-in-production
      APP_PUBLIC_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_ROOT: /app/uploads
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-password
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
